name: Build APK

on:
  push:
    branches: [arena/31b25773-temp-gmail]
    paths:
      - 'android/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then SM=sdkmanager
          elif [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else echo "sdkmanager not found"; exit 1; fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Collect APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/TempGmail-v2.1.apk
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempGmail-apk
          path: release/TempGmail-v2.1.apk
          if-no-files-found: error

      - name: Publish / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest release/TempGmail-v2.1.apk --clobber
          else
            gh release create apk-latest release/TempGmail-v2.1.apk \
              --title "Temp Gmail v2.0 (Native Kotlin APK)" \
              --notes "নেটিভ Kotlin অ্যাপ — আসল @gmail.com টেম্প মেইল (SmailPro পুল) + mail.tm ফলব্যাক। কোনো demo/fake ডেটা নেই।"
          fi

      - name: Commit log + APK
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch build.log
          git add -f build.log release/ 2>/dev/null || git add -f build.log
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "build: CI output [skip ci]"
            git push || echo "push raced — ok"
          fi
